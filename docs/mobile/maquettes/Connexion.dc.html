<div style="margin-top: 18px"><div style="display: flex; flex-direction: column; gap: 10px"><button type="button" style="width: 100%; height: 52px; border-radius: 26px; border: 1.5px solid #000000; background: #000000; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.37 1.43c0 1.14-.5 2.27-1.18 3.08-.74.9-1.99 1.57-2.99 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.57-2.27 1.2-2.98.81-.94 2.15-1.640 3.25-1.68.03.13.06.28.06.43zm4.56 15.71c-.03.07-.46 1.58-1.52 3.12-.94 1.34-1.94 2.71-3.43 2.71-1.52 0-1.9-.88-3.630-.88-1.7 0-2.3.91-3.67.91-1.38 0-2.33-1.26-3.43-2.8-1.29-1.82-2.32-4.63-2.32-7.28 0-4.28 2.8-6.55 5.55-6.55 1.45 0 2.67.95 3.6.95.86 0 2.22-1.01 3.9-1.01.61 0 2.89.06 4.37 2.19-.13.09-2.38 1.370-2.38 4.19 0 3.26 2.85 4.42 2.96 4.45z"/></svg>Continuer avec Apple</button><button type="button" style="width: 100%; height: 52px; border-radius: 26px; border: 1.5px solid #747775; background: #FFFFFF; color: #1F1F1F; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>Continuer avec Google</button><button type="button" style="width: 100%; height: 52px; border-radius: 26px; border: 1.5px solid #CFCBC1; background: #FFFFFF; color: #1B1F2A; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>Continuer avec Microsoft</button></div><div role="separator" style="display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: #474C59; font-size: 14px"><span style="flex: 1; height: 1px; background: #E5E2D9"></span>ou avec ton identifiant<span style="flex: 1; height: 1px; background: #E5E2D9"></span></div><form onSubmit="{{submit}}" novalidate style="display: flex; flex-direction: column; gap: 14px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: #1B1F2A">Identifiant
<input type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{user}}" onInput="{{setUser}}" aria-invalid="{{userInvalid}}" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid {{userBorder}}; background: #FFFFFF; color: #1B1F2A; font-family: inherit; font-size: 16px; outline-offset: 2px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: #1B1F2A">Mot de passe
<span style="position: relative; display: block">
<input type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onInput="{{setPw}}" aria-invalid="{{pwInvalid}}" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid {{pwBorder}}; background: #FFFFFF; color: #1B1F2A; font-family: inherit; font-size: 16px; outline-offset: 2px; padding-right: 64px">
<button type="button" onClick="{{togglePw}}" aria-pressed="{{pwShown}}" aria-label="{{pwLabel}}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #474C59; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><sc-if value="{{pwShown}}" hint-placeholder-val="{{ false }}"><path d="M3 3l18 18"></path></sc-if></svg></button>
</span></label>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #FBEAE6; color: #B4371F; font-size: 14px; line-height: 20px; font-weight: 600"><svg style="flex: none; margin-top: 1px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{error}}</span></p></sc-if>
<button type="submit" disabled="{{busy}}" style="margin-top: 4px; width: 100%; height: 54px; border: 0; border-radius: 27px; background: #2445C2; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">{{submitLabel}}</button>
</form>
<p style="margin: 18px 0 0; text-align: center; font-size: 15px; color: #474C59">Pas encore de compte ? <a href="#" style="color: #1A3496; font-weight: 700">Créer un compte</a></p>
<p style="margin: 8px 0 0; text-align: center; font-size: 13px; color: #474C59"><a href="#" style="color: #474C59">Données personnelles</a></p></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const user = s.user || ''; const pw = s.pw || ''; const shown = !!s.shown; const busy = !!s.busy; const err = s.err || '';
const bad = (f) => err && ((f === 'u' && !user) || (f === 'p' && !pw) || err.startsWith('Identifiant'));
return {
user: user, pw: pw, busy: busy,
setUser: (e) => this.setState({ user: e.target.value }),
setPw: (e) => this.setState({ pw: e.target.value }),
pwType: shown ? 'text' : 'password', pwShown: shown ? 'true' : 'false', pwLabel: shown ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
togglePw: () => this.setState({ shown: !shown }),
hasError: !!err, error: err,
userInvalid: bad('u') ? 'true' : 'false', pwInvalid: bad('p') ? 'true' : 'false',
userBorder: bad('u') ? '#B4371F' : '#CFCBC1', pwBorder: bad('p') ? '#B4371F' : '#CFCBC1',
submitLabel: busy ? 'Connexion…' : 'Se connecter',
submit: (e) => { e.preventDefault(); if (busy) return;
 if (!user || !pw) { this.setState({ err: !user && !pw ? 'Écris ton identifiant et ton mot de passe.' : (!user ? 'Écris ton identifiant.' : 'Écris ton mot de passe.') }); return; }
 this.setState({ busy: true, err: '' }); setTimeout(() => this.setState({ busy: false, err: 'Identifiant ou mot de passe incorrect. Vérifie les majuscules.' }), 900); }
};
}
}
</script>
</body>
</html>
