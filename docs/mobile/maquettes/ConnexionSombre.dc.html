<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #3A1F19; color: #FF9A85; font-size: 14px; line-height: 20px; font-weight: 600"><svg style="flex: none; margin-top: 1px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{error}}</span></p></sc-if>
<button type="submit" disabled="{{busy}}" style="margin-top: 4px; width: 100%; height: 54px; border: 0; border-radius: 27px; background: #7D95FF; color: #171411; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">{{submitLabel}}</button>
</form>
<p style="margin: 18px 0 0; text-align: center; font-size: 15px; color: #ABA398">Pas encore de compte ? <a href="#" style="color: #AEBDFF; font-weight: 700">Créer un compte</a></p>
<p style="margin: 4px 0 0; text-align: center; font-size: 13px; color: #ABA398"><a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: #ABA398">Données personnelles</a></p></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const user = s.user || ''; const pw = s.pw || ''; const shown = !!s.shown; const busy = !!s.busy; const err = s.err || '';
const bad = (f) => err && ((f === 'u' && !user) || (f === 'p' && !pw) || err.startsWith('Identifiant'));
return {
user: user, pw: pw, busy: busy,
setUser: (e) => this.setState({ user: e.target.value }),
setPw: (e) => this.setState({ pw: e.target.value }),
pwType: shown ? 'text' : 'password', pwShown: shown ? 'true' : 'false', pwLabel: shown ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
togglePw: () => this.setState({ shown: !shown }),
hasError: !!err, error: err,
userInvalid: bad('u') ? 'true' : 'false', pwInvalid: bad('p') ? 'true' : 'false',
userBorder: bad('u') ? '#FF9A85' : '#4A443C', pwBorder: bad('p') ? '#FF9A85' : '#4A443C',
submitLabel: busy ? 'Connexion…' : 'Se connecter',
submit: (e) => { e.preventDefault(); if (busy) return;
 if (!user || !pw) { this.setState({ err: !user && !pw ? 'Écris ton identifiant et ton mot de passe.' : (!user ? 'Écris ton identifiant.' : 'Écris ton mot de passe.') }); return; }
 this.setState({ busy: true, err: '' }); setTimeout(() => this.setState({ busy: false, err: 'Identifiant ou mot de passe incorrect. Vérifie les majuscules.' }), 900); }
};
}
}
</script>
