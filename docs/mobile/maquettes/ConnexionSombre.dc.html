c Google</button><button type="button" style="width: 100%; height: 52px; border-radius: 26px; border: 1.5px solid #4A443C; background: #221E1A; color: #F3EEE6; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>Continuer avec Microsoft</button></div><div role="separator" style="display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: #ABA398; font-size: 14px"><span style="flex: 1; height: 1px; background: #38322B"></span>ou avec ton identifiant<span style="flex: 1; height: 1px; background: #38322B"></span></div><form onSubmit="{{submit}}" novalidate style="display: flex; flex-direction: column; gap: 14px; margin: 0">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: #F3EEE6">Identifiant
<input type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{user}}" onInput="{{setUser}}" aria-invalid="{{userInvalid}}" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 20px; border-radius: 8px; border: 1.5px solid {{userBorder}}; background: #221E1A; color: #F3EEE6; font-family: inherit; font-size: 16px; outline-offset: 2px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: #F3EEE6">Mot de passe
<span style="position: relative; display: block">
<input type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onInput="{{setPw}}" aria-invalid="{{pwInvalid}}" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 20px; border-radius: 8px; border: 1.5px solid {{pwBorder}}; background: #221E1A; color: #F3EEE6; font-family: inherit; font-size: 16px; outline-offset: 2px; padding-right: 64px">
<button type="button" onClick="{{togglePw}}" aria-pressed="{{pwShown}}" aria-label="{{pwLabel}}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #ABA398; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><sc-if value="{{pwShown}}" hint-placeholder-val="{{ false }}"><path d="M3 3l18 18"></path></sc-if></svg></button>
</span></label>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: #3A1F19; color: #FF9A85; font-size: 14px; line-height: 20px; font-weight: 600"><svg style="flex: none; margin-top: 1px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{error}}</span></p></sc-if>

<p style="margin: 4px 0 0; text-align: center; font-size: 13px; color: #ABA398"><a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: #ABA398">Données personnelles</a></p></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const user = s.user || ''; const pw = s.pw || ''; const shown = !!s.shown; const busy = !!s.busy; const err = s.err || '';
const bad = (f) => err && ((f === 'u' && !user) || (f === 'p' && !pw) || err.startsWith('Identifiant'));
return {
user: user, pw: pw, busy: busy,
setUser: (e) => this.setState({ user: e.target.value }),
setPw: (e) => this.setState({ pw: e.target.value }),
pwType: shown ? 'text' : 'password', pwShown: shown ? 'true' : 'false', pwLabel: shown ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
togglePw: () => this.setState({ shown: !shown }),
hasError: !!err, error: err,
userInvalid: bad('u') ? 'true' : 'false', pwInvalid: bad('p') ? 'true' : 'false',
userBorder: bad('u') ? '#FF9A85' : '#4A443C', pwBorder: bad('p') ? '#FF9A85' : '#4A443C',
submitLabel: busy ? 'Connexion…' : 'Se connecter',
submit: (e) => { e.preventDefault(); if (busy) return;
 if (!user || !pw) { this.setState({ err: !user && !pw ? 'Écris ton identifiant et ton mot de passe.' : (!user ? 'Écris ton identifiant.' : 'Écris ton mot de passe.') }); return; }
 this.setState({ busy: true, err: '' }); setTimeout(() => this.setState({ busy: false, err: 'Identifiant ou mot de passe incorrect. Vérifie les majuscules.' }), 900); }
};
}
}
</script>
