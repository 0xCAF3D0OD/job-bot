main>*{flex-shrink:0}
@keyframes ft-sun-open{0%,8%{transform:scaleY(.12)}28%,100%{transform:scaleY(1)}}@keyframes ft-rays-in{0%,22%{opacity:0;transform:scale(.6) rotate(0)}40%{opacity:1;transform:scale(1) rotate(15deg)}85%{opacity:1;transform:scale(1) rotate(60deg)}100%{opacity:0;transform:scale(1) rotate(75deg)}}@keyframes ft-loupe{0%{opacity:0;transform:translate(40px,40px)}15%,35%{opacity:1;transform:translate(0,0)}55%,75%{opacity:1;transform:translate(52px,-4px)}95%,100%{opacity:0;transform:translate(70px,30px)}}@keyframes ft-mag-l{0%,13%{transform:scale(1)}18%,33%{transform:scale(1.35)}38%,100%{transform:scale(1)}}@keyframes ft-mag-r{0%,53%{transform:scale(1)}58%,73%{transform:scale(1.35)}78%,100%{transform:scale(1)}}@keyframes ft-dot-out{0%,10%{transform:scale(1)}20%,80%{transform:scale(0)}92%,100%{transform:scale(1)}}@keyframes ft-pop-in{0%,14%{transform:scale(0)}28%,76%{transform:scale(1)}88%,100%{transform:scale(0)}}@keyframes ft-bell-ring{0%,28%{transform:rotate(0)}36%{transform:rotate(16deg)}44%{transform:rotate(-14deg)}52%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}68%,100%{transform:rotate(0)}}@keyframes face-wink{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(.15)}}.ft-box{transform-box:fill-box;transform-origin:50% 50%}.ft-top{transform-box:fill-box;transform-origin:50% 0}.ft-once .ft-sun{animation:ft-sun-open 2.8s cubic-bezier(.2,.8,.2,1) .5s both}.ft-once .ft-rays{animation:ft-rays-in 2.8s ease-out .5s both}@media (prefers-reduced-motion: reduce){.ft-once,.ft-once *{animation:none !important}.ft-once .ft-loupe,.ft-once .ft-rays,.ft-once .ft-pop{display:none}}
/*jaMotion*/button,a,input,[role=tab],[role=radio],[role=switch]{transition:background-color .2s cubic-bezier(.2,0,0,1),color .2s,border-color .2s,box-shadow .2s,transform .12s}button:active,a:active{transform:scale(.97)}@media (prefers-reduced-motion: reduce){button,a,input{transition:none}button:active,a:active{transform:none}}
body{margin:0}
a{color:#2445C2}a:hover{color:#1A3496}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.confetti span{animation:burst 1.1s cubic-bezier(.2,.8,.2,1) both}

.pop{animation:pop .6s linear(0, 0.5 6%, 1.2 16%, 1.32 22%, 1.2 32%, 0.96 46%, 1.03 60%, 0.99 76%, 1) both}
@keyframes sunTurn{from{transform:rotate(-40deg) scale(.7);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
.sun{transform-origin:50% 50%;animation:sunTurn .9s cubic-bezier(.2,.8,.2,1) both}
.ob-scribble path{stroke-dasharray:1;stroke-dashoffset:0;animation:obDraw 1s .7s cubic-bezier(.45,0,.55,1) both}
@keyframes obDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ob-hand{animation:obWrite 1s 1.6s steps(22,end) both}
@keyframes obWrite{from{clip-path:inset(-30% 100% -30% -10%)}to{clip-path:inset(-30% -10% -30% -10%)}}
@media (prefers-reduced-motion: reduce){.confetti span{animation:none;opacity:0}.sun,.pop,.ob-scribble path,.ob-hand{animation:none}}
