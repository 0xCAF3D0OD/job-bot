<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jobA1, mise à jour (sombre)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes waitSpin{to{transform:rotate(360deg)}}
.wait-spin{transform-origin:50px 50px;animation:waitSpin 3s linear infinite}
@keyframes waitPulse{0%,100%{opacity:1}50%{opacity:.3}}
.wait-pulse{animation:waitPulse 1.2s ease-in-out infinite}.wait-pulse2{animation:waitPulse 1.2s ease-in-out .6s infinite}
@keyframes triNo{0%{transform:rotate(0)}25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}100%{transform:rotate(0)}}.tri-no{transform-origin:50% 86%;animation:triNo .6s cubic-bezier(.2,0,0,1) .25s both}
button{transition:background-color .2s cubic-bezier(.2,0,0,1),transform .12s}button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:default}
circle[stroke-dasharray]{transition:stroke-dasharray 1s linear}
@media (prefers-reduced-motion: reduce){.wait-spin,.wait-pulse,.wait-pulse2,.tri-no{animation:none}button,circle[stroke-dasharray]{transition:none}}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="m-title" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #171411; color: #F3EEE6; font-family: Figtree, system-ui, sans-serif; overflow: hidden">
<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px 32px 0; text-align: center">
<img src="../illustrations/personnage/perso-09-cables-800.webp" alt="" aria-hidden="true" width="126" height="250" style="display:block;height:250px;width:auto">
<h1 id="m-title" style="margin: 4px 0 0; font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -0.3px">jobA1 se met à jour</h1>
<p aria-live="polite" style="margin: 0; max-width: 310px; font-size: 16px; line-height: 23px; color: #ABA398">Ça revient dans un instant. Ce que tu écrivais est gardé.</p>
</main>
<div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px 34px">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #ABA398">{{statusText}}</p>
<button type="button" onClick="{{retry}}" disabled="{{busy}}" style="width: 100%; height: 52px; border: 1.5px solid #7D95FF; border-radius: 26px; background: transparent; color: #AEBDFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Réessayer maintenant</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() { this.setState({ left: 10, busy: false }); this.tick = setInterval(() => { const s = this.state || {}; if (s.busy) return; const left = (s.left ?? 10) - 1; if (left <= 0) this.go(); else this.setState({ left }); }, 1000); }
componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.t); }
go() { this.setState({ busy: true, left: 0 }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ busy: false, left: 10 }), 1500); }
renderVals() {
const s = this.state || {};
const left = s.left ?? 10; const busy = !!s.busy;
return {
busy: busy,
dash: busy ? "100 100" : `${(10 - left) * 10} 100`,
statusText: busy ? "Nouvel essai en cours…" : `Nouvel essai dans ${left} s`,
retry: () => this.go()
};
}
}
</script>
</body>
</html>
