<h1 id="m-title" style="margin: 4px 0 0; font-size: 26px; line-height: 32px; font-weight: 800; letter-spacing: -0.3px">Maintenance en cours</h1>
<p aria-live="polite" style="margin: 0; max-width: 310px; font-size: 16px; line-height: 23px; color: #474C59">Sauvegarde et mise à jour de la base. Retour prévu vers 14 h 30.</p>

<div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px 34px">

<button type="button" onClick="{{retry}}" disabled="{{busy}}" style="width: 100%; height: 52px; border: 1.5px solid #2445C2; border-radius: 26px; background: transparent; color: #1A3496; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Réessayer maintenant</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() { this.setState({ left: 10, busy: false }); this.tick = setInterval(() => { const s = this.state || {}; if (s.busy) return; const left = (s.left ?? 10) - 1; if (left <= 0) this.go(); else this.setState({ left }); }, 1000); }
componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.t); }
go() { this.setState({ busy: true, left: 0 }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ busy: false, left: 10 }), 1500); }
renderVals() {
const s = this.state || {};
const left = s.left ?? 10; const busy = !!s.busy;
return {
busy: busy,
dash: busy ? "100 100" : `${(10 - left) * 10} 100`,
statusText: busy ? "Nouvel essai en cours…" : `Nouvel essai dans ${left} s`,
retry: () => this.go()
};
}
}
</script>
