<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const on = s.on || [true, true, true, true, true, false, false];
const o = {};
const N = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
for (let i = 0; i < 7; i++) { o['dc'+i] = on[i] ? 'on' : 'off'; o['dp'+i] = String(on[i]); o['dt'+i] = () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); }; }
const pick = N.filter((x, i) => on[i]);
o.dayNote = pick.length === 0 ? 'Aucun jour choisi : jobA1 ne cherche plus.' : (pick.length === 5 && on[0] && on[4] && !on[5] && !on[6]) ? 'jobA1 cherche des offres du lundi au vendredi.' : 'jobA1 cherche des offres le ' + pick.join(', ') + '.';
return o;
}
}
</script>
