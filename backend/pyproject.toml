[project]
name = "jobbot"
version = "0.5.0"
description = "Assistant de recherche d'emploi : collecte, tri, notation et suivi des candidatures"
authors = [
    { name = "0xCAF3D0OD" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    # Le schéma de procrastinate est appliqué par une migration Alembic :
    # toute montée de version doit s'accompagner d'une migration (voir docs/exploitation.md).
    "httpx>=0.28.1",
    "procrastinate>=3.10.0,<3.11",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jobbot = "jobbot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
