# L'historique des versions, numéroté et assemblé sur main après chaque fusion : chaque PR dépose un
# fragment changelog.d/<sujet>.md sans numéro ; ici, il reçoit le numéro suivant dans l'ordre de fusion
# (changelog.d/X.Y.Z.md) et CHANGELOG.md est assemblé. Une PR ne touche aucun fichier partagé.
name: Historique

on:
  push:
    branches: [main]
    paths:
      - "changelog.d/**"
      - "scripts/changelog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  assembler:
    name: Assembler CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      # L'historique complet : l'ordre de fusion d'un fragment est la date du commit qui l'a ajouté.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Numéroter et assembler
        run: python3 scripts/changelog.py --number
      # Un envoi fait avec le jeton de l'action ne relance pas les workflows : pas de boucle.
      - name: Enregistrer s'il a changé
        run: |
          git add -A changelog.d CHANGELOG.md
          if git diff --cached --quiet; then echo "Rien à numéroter, CHANGELOG.md déjà à jour"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: numéros attribués et CHANGELOG.md assemblé depuis changelog.d/"
          git pull --rebase origin main
          # Une autre fusion arrivée entre-temps : ses fragments prennent les numéros suivants.
          python3 scripts/changelog.py --number
          git add -A changelog.d CHANGELOG.md
          git diff --cached --quiet || git commit --amend --no-edit
          git push origin HEAD:main
