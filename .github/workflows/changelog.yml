# L'historique des versions, assemblé sur main après chaque fusion (1.6.36) : chaque PR ajoute son
# fichier changelog.d/X.Y.Z.md et ne touche plus à CHANGELOG.md, donc plus de conflit entre PR.
name: Historique

on:
  push:
    branches: [main]
    paths:
      - "changelog.d/**"
      - "scripts/changelog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  assembler:
    name: Assembler CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembler
        run: python3 scripts/changelog.py
      # Un envoi fait avec le jeton de l'action ne relance pas les workflows : pas de boucle.
      - name: Enregistrer s'il a changé
        run: |
          if git diff --quiet -- CHANGELOG.md; then echo "CHANGELOG.md déjà à jour"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: CHANGELOG.md assemblé depuis changelog.d/"
          git pull --rebase origin main
          python3 scripts/changelog.py
          git add CHANGELOG.md
          git diff --cached --quiet || git commit --amend --no-edit
          git push origin HEAD:main
