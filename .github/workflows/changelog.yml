# L'historique des versions, numéroté et assemblé sur main après chaque fusion : chaque PR dépose un
# fragment changelog.d/<sujet>.md sans numéro ; ici, il reçoit le numéro suivant dans l'ordre de fusion
# (changelog.d/X.Y.Z.md) et CHANGELOG.md est assemblé. Une PR ne touche aucun fichier partagé.
name: Historique

on:
  push:
    branches: [main]
    paths:
      - "changelog.d/**"
      - "scripts/changelog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  assembler:
    name: Assembler CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      # L'historique complet : l'ordre de fusion d'un fragment est la date du commit qui l'a ajouté.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Un envoi fait avec le jeton de l'action ne relance pas les workflows : pas de boucle.
      # Toujours repartir de main à jour : une fusion arrivée entre-temps apporte ses fragments, qui
      # prennent les numéros suivants, et un envoi refusé (une autre fusion, ou l'action des décisions
      # qui a poussé juste avant) est retenté jusqu'à 5 fois au lieu d'échouer.
      - name: Enregistrer s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for essai in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/changelog.py --number
            git add -A changelog.d CHANGELOG.md
            if git diff --cached --quiet; then echo "Rien à numéroter, CHANGELOG.md déjà à jour"; exit 0; fi
            git commit -q -m "chore: numéros attribués et CHANGELOG.md assemblé depuis changelog.d/"
            git push origin HEAD:main && exit 0
            sleep $((essai * 5))
          done
          exit 1
