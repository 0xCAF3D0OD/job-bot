# Les images du serveur (deploy/prod, docs/136), à chaque envoi sur main, en même temps que les
# tests : ghcr.io/0xcaf3d0od/joba1-api et joba1-web, étiquetées du commit complet et de `main`.
# Rien n'est déployé ici : `make deploy`, depuis le Mac, prend le dernier commit dont ce
# workflow ET les tests ont réussi.
name: Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "changelog.d/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/0xcaf3d0od

jobs:
  images:
    name: Images du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API (serveur jobA1)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/prod/Dockerfile
          target: api
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/joba1-api:${{ github.sha }}
            ${{ env.REGISTRY }}/joba1-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Site (Caddy et interface)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/prod/Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.REGISTRY }}/joba1-web:${{ github.sha }}
            ${{ env.REGISTRY }}/joba1-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
