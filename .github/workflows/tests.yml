# Les tests du serveur et de l'interface, à chaque envoi sur main et à chaque PR (1.6.14), comme
# `make test` en local. Le test de l'audit des règles a son propre workflow (audit-regles.yml).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur (pytest)
    runs-on: ubuntu-latest
    # Une vraie base PostgreSQL, comme en local (backend/tests/conftest.py) ; le rôle de
    # l'application (jobbot_app) est créé par les migrations.
    services:
      postgres:
        image: postgres:17
        # Sans mot de passe, comme une installation locale : les tests se connectent aussi avec
        # le rôle de l'application (jobbot_app), qui n'en a pas.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jobbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBBOT_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/jobbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dépendances
        working-directory: backend
        run: uv sync --frozen
      - name: Tests
        working-directory: backend
        run: uv run pytest -q

  interface:
    name: Interface (vitest, types, poids)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        working-directory: frontend
        run: npm ci
      # La suite complète : un fichier de test qui ne démarre pas la fait échouer (vitest.total.ts).
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Types
        working-directory: frontend
        run: npm run typecheck
      - name: Budget de poids des pages
        working-directory: frontend
        run: npm run poids

  historique:
    name: Historique (changelog.d)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Les fichiers de changelog.d et leur assemblage
        run: make changelog-check
      # La base de comparaison : sur une PR, la CI travaille sur le commit de fusion de test
      # (refs/pull/N/merge), dont le premier parent est main au moment du passage. Le base.sha de
      # l'événement, lui, reste l'ancien main : après une reprise de main dans la branche, tout ce que
      # main apporte (des changelog.d/X.Y.Z.md numérotés à la fusion) compterait comme ajouté par la PR.
      - name: Base de comparaison (main au moment du passage)
        if: github.event_name == 'pull_request'
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1)
          else git fetch -q origin "${{ github.base_ref }}" && base=$(git merge-base FETCH_HEAD HEAD); fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "Comparé à $base"
      # Une PR ne touche aucun fichier partagé : elle dépose changelog.d/<sujet>.md, sans numéro (donné à
      # la fusion par changelog.yml), et ne modifie ni CHANGELOG.md ni les anciens tableaux de réservation,
      # que deux PR modifiaient au même endroit.
      - name: Aucun fichier partagé (numéro, tableaux)
        if: github.event_name == 'pull_request'
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE" HEAD)
          changed=$(git diff --name-only "$BASE" HEAD)
          numbered=$(echo "$added" | grep -E '^changelog\.d/[0-9]+\.[0-9]+\.[0-9]+\.md$' || true)
          if [ -n "$numbered" ] && ! echo "$changed" | grep -qx scripts/changelog.py; then
            echo "::error::$numbered : le numéro est donné à la fusion. Renomme-le en changelog.d/<sujet>.md (minuscules, chiffres, tirets)."
            exit 1
          fi
          edited=$(git diff --name-only --diff-filter=AM "$BASE" HEAD)
          if echo "$edited" | grep -qx docs/versions.md; then
            echo "::error file=docs/versions.md::docs/versions.md n'existe plus : le numéro est donné à la fusion, changelog.d/ fait foi."
            exit 1
          fi
      - name: CHANGELOG.md n'est pas modifié à la main
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qx CHANGELOG.md && ! echo "$changed" | grep -qx scripts/changelog.py; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md est assemblé sur main : ajoute plutôt changelog.d/<sujet>.md et laisse CHANGELOG.md tel quel."
            exit 1
          fi
