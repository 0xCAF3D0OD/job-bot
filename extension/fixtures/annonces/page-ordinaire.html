<!doctype html>
<html lang="fr"><head><title>Recette de la tarte aux pommes</title></head>
<body><main><h1>Tarte aux pommes</h1><p>Étale la pâte, coupe les pommes en fines lamelles, saupoudre de sucre et de cannelle, enfourne trente-cinq minutes à 200 degrés. Laisse refroidir avant de servir, avec une boule de glace vanille si tu en as.</p></main></body></html>
