<!-- Page type : jobup demande le code de confirmation de l'alerte (structure reconstituée, pas un relevé). -->
<main>
  <h1>Confirme ton adresse e-mail</h1>
  <form id="code-form">
    <p>Entre le code de vérification envoyé à ton adresse.</p>
    <label for="otp">Code</label>
    <input id="otp" name="code" type="text" inputmode="numeric" autocomplete="one-time-code">
    <button type="submit">Confirmer</button>
  </form>
</main>
